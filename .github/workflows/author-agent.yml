name: Author agent

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  resolve:
    name: Resolve author task
    if: >-
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      (startsWith(github.event.comment.body, '/oc') ||
      startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      task: ${{ steps.resolve.outputs.task }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate and resolve task
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.author_guard resolve

  author:
    name: Author
    needs: resolve
    if: >-
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      (startsWith(github.event.comment.body, '/oc') ||
      startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: author-agent
    concurrency:
      group: author-agent-${{ needs.resolve.outputs.task }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      actions: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Install OpenCode
        env:
          OPENCODE_VERSION: v1.18.34
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --version "$OPENCODE_VERSION" --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      - name: Reserve permitted author execution
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.author_guard claim
      - name: Author
        if: steps.admission.outputs.allowed == 'true'
        run: opencode github run
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          MODEL: ${{ vars.AUTHOR_MODEL }}
          SHARE: 'false'
      - name: Record published work
        if: always() && steps.admission.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/author-finalizer/scripts" "$RUNNER_TEMP/author-finalizer/.github"
          git show "${GUARD_SOURCE_SHA}:scripts/author_guard.py" > "$RUNNER_TEMP/author-finalizer/scripts/author_guard.py"
          git show "${GUARD_SOURCE_SHA}:scripts/review_handoff.py" > "$RUNNER_TEMP/author-finalizer/scripts/review_handoff.py"
          git show "${GUARD_SOURCE_SHA}:scripts/__init__.py" > "$RUNNER_TEMP/author-finalizer/scripts/__init__.py"
          git show "${GUARD_SOURCE_SHA}:.github/author-cycle.json" > "$RUNNER_TEMP/author-finalizer/.github/author-cycle.json"
          export AUTHOR_CYCLE_CONFIG="$RUNNER_TEMP/author-finalizer/.github/author-cycle.json"
          cd "$RUNNER_TEMP/author-finalizer"
          python3 -m scripts.author_guard finish
